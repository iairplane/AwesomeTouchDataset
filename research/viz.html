<script>
(() => {
  'use strict';
  const graph = JSON.parse(document.querySelector('#graph').textContent);
  const canvas = document.querySelector('canvas');
  const g = canvas.getContext('2d');
  const laneField = document.querySelector('#lane');
  const query = document.querySelector('#query');
  const matches = document.querySelector('#matches');
  const count = document.querySelector('#count');
  const detail = document.querySelector('#detail');
  const legend = document.querySelector('#legend');
  const lanes = {
    hardware_collection: ['传感器与采集', '#0a786d'],
    tactile_representation: ['触觉表示', '#a94722'],
    policy_vla: ['策略与 VLA', '#145ea1'],
    world_model: ['世界模型', '#6848a4'],
    human_tactile_data: ['人手触觉数据', '#927000'],
    general_backbone: ['通用骨干', '#536778']
  };
  const laneKeys = Object.keys(lanes);
  const format = new Intl.NumberFormat('zh-CN');
  const nodes = graph.nodes;
  const links = graph.links;
  const years = nodes.map(n => n.year).filter(y => y);
  const firstYear = d3.min(years) ?? 2009;
  const lastYear = d3.max(years) ?? 2026;
  const axis = d3.scaleLinear().domain([firstYear, lastYear === firstYear ? lastYear + 1 : lastYear]);
  const yYears = d3.scalePoint().domain(laneKeys);
  const adjacent = new Map(nodes.map(n => [n.paperId, []]));
  const core = n => n.is_core === true || n.is_core === 1 || /^(true|1|yes)$/i.test(String(n.is_core));
  const radius = n => 2.6 + 1.27 * Math.log1p(Number(n.citationCount) || 0);
  const largestRadius = d3.max(nodes, radius);
  const hasUnknown = nodes.some(n => !n.year);
  let pickTree = null;
  let visible = nodes;
  let visibleIds = new Set(nodes.map(n => n.paperId));
  let hovered = null;
  let selected = null;
  let transform = d3.zoomIdentity;
  let width = 0;
  let height = 0;
  let ratio = 1;
  let scheduled = false;

  const state = graph.complete === false ? '部分图谱 · ' : '';
  document.querySelector('#meta').textContent = `${state}${format.format(nodes.length)} 篇论文 · ${format.format(links.length)} 条引文 · Semantic Scholar Graph API`;
  for (const [key, [label, color]] of Object.entries(lanes)) {
    laneField.add(new Option(label, key));
    const item = document.createElement('li');
    const swatch = document.createElement('span');
    swatch.className = 'swatch';
    swatch.style.backgroundColor = color;
    item.append(swatch, label);
    legend.append(item);
  }
  for (const edge of links) {
    adjacent.get(edge.source).push(edge);
    if (edge.target !== edge.source) adjacent.get(edge.target).push(edge);
  }

  const xHome = n => n.year ? axis(n.year) : 29;
  const yHome = n => yYears(n.lane) ?? height / 2;
  const simulation = d3.forceSimulation(nodes).stop()
    .force('citation', d3.forceLink(links).id(n => n.paperId).distance(38).strength(.035))
    .force('year', d3.forceX(xHome).strength(.55))
    .force('lane', d3.forceY(yHome).strength(.15))
    .force('collide', d3.forceCollide(n => radius(n) + 1.4))
    .force('charge', d3.forceManyBody().strength(-13).distanceMax(145))
    .alphaDecay(.045)
    .on('tick', () => {
      const yearStep = Math.max(12, (width - 90) / Math.max(lastYear - firstYear, 1));
      for (const node of nodes) {
        const offset = .46 * yearStep;
        node.x = Math.max(xHome(node) - offset, Math.min(xHome(node) + offset, node.x));
        node.y = Math.max(44, Math.min(height - 15, node.y));
      }
      pickTree = null;
      redraw();
    });

  function redraw() {
    if (scheduled) return;
    scheduled = true;
    requestAnimationFrame(() => { scheduled = false; draw(); });
  }

  function draw() {
    g.setTransform(ratio, 0, 0, ratio, 0, 0);
    g.clearRect(0, 0, width, height);
    g.font = '12px system-ui';
    g.fillStyle = '#485d70';
    g.textAlign = 'center';
    const step = Math.max(1, Math.ceil((lastYear - firstYear) * 55 / Math.max(1, width * transform.k)));
    const tickYears = d3.range(firstYear, lastYear + 1, step);
    if (hasUnknown) tickYears.unshift(null);
    g.beginPath();
    for (const year of tickYears) {
      const x = transform.applyX(year === null ? 29 : axis(year));
      if (x < 12 || x > width - 12) continue;
      g.moveTo(x, 28);
      g.lineTo(x, height);
      g.fillText(year === null ? '未知' : year, x, 19);
    }
    g.strokeStyle = '#e1e9f0';
    g.stroke();
    g.save();
    g.beginPath();
    g.rect(0, 28, width, height - 28);
    g.clip();
    g.translate(transform.x, transform.y);
    g.scale(transform.k, transform.k);
    const active = hovered ?? selected;
    const incident = active ? new Set(adjacent.get(active.paperId)) : null;
    const neighbors = active ? new Set([active.paperId]) : null;
    const heavy = [];
    g.beginPath();
    for (const edge of links) {
      if (!visibleIds.has(edge.source.paperId) || !visibleIds.has(edge.target.paperId)) continue;
      if (incident?.has(edge)) {
        neighbors.add(edge.source.paperId).add(edge.target.paperId);
        heavy.push(edge);
        continue;
      }
      g.moveTo(edge.source.x, edge.source.y);
      g.lineTo(edge.target.x, edge.target.y);
    }
    g.strokeStyle = active ? 'rgba(149,164,181,.10)' : 'rgba(149,164,181,.34)';
    g.lineWidth = 1 / transform.k;
    g.stroke();
    for (const edge of heavy) {
      g.beginPath();
      g.moveTo(edge.source.x, edge.source.y);
      g.lineTo(edge.target.x, edge.target.y);
      g.strokeStyle = edge.source === active ? '#b6592c' : '#20638d';
      g.lineWidth = 1.7 / transform.k;
      g.stroke();
    }
    for (const node of visible) {
      g.globalAlpha = neighbors && !neighbors.has(node.paperId) ? .13 : .94;
      g.fillStyle = lanes[node.lane]?.[1] ?? '#536778';
      g.beginPath();
      g.arc(node.x, node.y, radius(node), 0, 2 * Math.PI);
      g.fill();
      if (node === active || core(node)) {
        g.strokeStyle = '#0f2538';
        g.lineWidth = (node === active ? 2 : 1) / transform.k;
        g.stroke();
      }
    }
    g.restore();
  }

  function select(node, pin = false) {
    if (pin) selected = node;
    const entry = node ?? selected;
    detail.replaceChildren();
    const p = document.createElement('p');
    if (!entry) {
      p.textContent = '悬停查看直接引用，点击固定详情。橙线指向它引用的论文，蓝线来自引用它的论文。';
      detail.append(p);
      return;
    }
    const title = document.createElement('h2');
    title.textContent = entry.title;
    const neighbors = adjacent.get(entry.paperId);
    const citing = neighbors.filter(edge => edge.target === entry).length;
    p.textContent = `${entry.year || '年份待核'} · ${lanes[entry.lane]?.[0] ?? '方向待核'} · 总引用 ${format.format(entry.citationCount ?? 0)}。图内 ${citing} 篇论文引用它，它引用了图内 ${neighbors.length - citing} 篇。`;
    const source = document.createElement('a');
    source.href = `https://www.semanticscholar.org/paper/${encodeURIComponent(entry.paperId)}`;
    source.textContent = 'Semantic Scholar';
    source.target = '_blank';
    source.rel = 'noopener';
    detail.append(title, p, source);
    if (entry.arxiv) {
      const arxiv = document.createElement('a');
      arxiv.href = `https://arxiv.org/abs/${encodeURIComponent(entry.arxiv)}`;
      arxiv.textContent = 'arXiv';
      arxiv.target = '_blank';
      arxiv.rel = 'noopener';
      detail.append(' · ', arxiv);
    }
  }

  function filter() {
    const needle = query.value.trim().toLowerCase();
    const lane = laneField.value;
    const laneNodes = lane ? nodes.filter(node => node.lane === lane) : nodes;
    const hits = needle ? laneNodes.filter(node => `${node.title} ${node.arxiv ?? ''} ${node.venue ?? ''}`.toLowerCase().includes(needle)) : laneNodes;
    const context = new Set(hits.map(node => node.paperId));
    if (needle) for (const node of hits) {
      for (const edge of adjacent.get(node.paperId)) context.add(edge.source.paperId).add(edge.target.paperId);
    }
    visible = needle ? laneNodes.filter(node => context.has(node.paperId)) : laneNodes;
    visibleIds = new Set(visible.map(node => node.paperId));
    pickTree = null;
    if (selected && !visibleIds.has(selected.paperId)) selected = null;
    hovered = null;
    matches.replaceChildren();
    matches.hidden = !needle || !hits.length;
    count.textContent = needle ? `匹配 ${format.format(hits.length)} 篇 · 图中显示 ${format.format(visible.length)} 篇` : `显示 ${format.format(visible.length)} / ${format.format(nodes.length)} 篇`;
    if (needle) for (const node of hits.slice(0, 12)) {
      const li = document.createElement('li');
      const button = document.createElement('button');
      button.type = 'button';
      button.textContent = node.title;
      button.addEventListener('click', () => {
        select(node, true);
        d3.select(canvas).call(zoom.translateTo, node.x, node.y);
        redraw();
      });
      li.append(button);
      matches.append(li);
    }
    select(selected);
    redraw();
  }

  function resize() {
    const rect = canvas.getBoundingClientRect();
    width = rect.width;
    height = rect.height;
    ratio = window.devicePixelRatio || 1;
    canvas.width = Math.round(width * ratio);
    canvas.height = Math.round(height * ratio);
    axis.range([hasUnknown ? 87 : 47, Math.max(96, width - 36)]);
    yYears.range([88, height - 50]);
    for (const [index, node] of nodes.entries()) {
      node.x = xHome(node);
      node.y = yHome(node) + ((index * 37) % 53 - 26);
      node.vx = node.vy = 0;
    }
    pickTree = null;
    simulation.force('year').x(xHome);
    simulation.force('lane').y(yHome);
    simulation.alpha(.95).restart();
    redraw();
  }

  function pick(event) {
    const [x, y] = d3.pointer(event, canvas);
    if (y < 28) return null;
    pickTree ??= d3.quadtree(visible, n => n.x, n => n.y);
    const [gx, gy] = transform.invert([x, y]);
    const node = pickTree.find(gx, gy, largestRadius + 4 / transform.k);
    return node && Math.hypot(gx - node.x, gy - node.y) <= radius(node) + 4 / transform.k ? node : null;
  }

  const zoom = d3.zoom().scaleExtent([.45, 10]).on('zoom', event => {
    transform = event.transform;
    redraw();
  });
  d3.select(canvas).call(zoom).on('pointermove', event => {
    const match = pick(event);
    if (match === hovered) return;
    hovered = match;
    select(hovered);
    redraw();
  }).on('pointerleave', () => {
    hovered = null;
    select(selected);
    redraw();
  }).on('click', event => {
    select(pick(event), true);
    redraw();
  });
  document.querySelector('#reset').addEventListener('click', () => {
    d3.select(canvas).call(zoom.transform, d3.zoomIdentity);
    query.value = laneField.value = '';
    selected = null;
    filter();
  });
  laneField.addEventListener('change', filter);
  query.addEventListener('input', filter);
  new ResizeObserver(resize).observe(canvas);
  filter();
})();
</script>
</html>
